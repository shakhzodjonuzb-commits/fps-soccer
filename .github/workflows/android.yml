name: FPS Soccer CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fps-soccer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and web build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Debug TypeScript
        run: |
          npm ls typescript
          node -e "import('typescript').then(m => console.log({
            version: m.default?.version,
            target: !!m.default?.ScriptTarget,
            namedTarget: !!m.ScriptTarget
          }))"

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production web build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: fps-soccer-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

  android:
    name: Capacitor Android debug APK
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build local web assets
        run: npm run build

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Apply native Android settings
        run: node scripts/configure-android.mjs

      - name: Sync local Capacitor assets
        run: npx cap sync android

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fps-soccer-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build signed release APK
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured."
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fps-soccer-release.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/fps-soccer-release.keystore"

          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Upload signed release APK
        if: steps.release.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fps-soccer-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 60